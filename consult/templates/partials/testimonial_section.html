{% load static %}

<!-- Testimonial Start -->
<div class="container-fluid bg-secondary p-0">
    <div class="row g-0">
        <div class="col-lg-6" style="min-height: 500px;">
            <div class="position-relative h-100">
                <img class="position-absolute w-100 h-100" src="{% static 'img/testimonial.jpg' %}" style="object-fit: cover;">
            </div>
        </div>
        <div class="col-lg-6 py-6 px-5">
            <h1 class="display-5 mb-4">What Say Our Client!!!</h1>
            <div class="owl-carousel testimonial-carousel">
                {% for testimonial in testimonials %}
                <div class="testimonial-item">
                    <p class="fs-4 fw-normal mb-4">
                        <i class="fa fa-quote-left text-primary me-3"></i>{{ testimonial.comment }}
                    </p>
                    <div class="d-flex align-items-center">
                        <img class="img-fluid rounded-circle" src="{{ testimonial.client_image.url }}" alt="{{ testimonial.client_name }}">
                        <div class="ps-4">
                            <h3>{{ testimonial.client_name }}</h3>
                            <span class="text-uppercase">{{ testimonial.profession }}</span>
                        </div>
                    </div>
                </div>
                {% empty %}
                <p>No testimonials available yet.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
<!-- Testimonial End -->
